octo_path_optimizer_node:
  ros__parameters:
    input_path_topic: /planned_path
    obstacle_cloud_topic: /ego_obstacles
    output_path_topic: /optimized_path
    output_marker_topic: /optimized_path_marker
    frame_id: map
    path_resample_interval: 0.1
    obstacle_z_min: -0.2
    obstacle_z_max: 2.0
    map_resolution: 0.1
    map_x_size: 50.0
    map_y_size: 50.0
    map_z_size: 10.0
    map_inflate_value: 1.0
    max_vel: 2.0
    max_acc: 3.0
    max_jerk: 4.0
    max_obstacle_points: 5000
    reoptimize_on_obstacle_update: true
    min_obstacle_reoptimize_period: 1.0
    # Ego rebound 优化主要在路径穿过障碍时起作用；无障碍时可能几乎不改变控制点。
    # 这里启用一个确定性的 3D elastic-band 后处理，保证 /optimized_path
    # 相对 /planned_path 产生可见平滑，同时限制最大偏离，避免切出全局可通行走廊。
    enable_geometric_smoothing: true
    smoothing_iterations: 80
    smoothing_data_weight: 0.18
    smoothing_smooth_weight: 0.32
    max_smoothing_deviation: 0.8
    smoothing_obstacle_clearance: 1.0
