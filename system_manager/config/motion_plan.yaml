motion_plan:
  ros__parameters:
    global_path_topic: /optimized_path
    # FASTLIO2 维护 map -> base_link TF；Gazebo world_tf_publisher 应关闭，
    # 避免两个动态 TF 源同时发布 base_link。
    pose_source: tf
    odom_topic: ''
    # OctoMap /ego_obstacles 是静态可通行性地图层，应该留给 OctoPlanner 生成全局路径。
    # Ego 的栅格障碍层只订阅局部动态障碍点云；点云可在 map/base_link/传感器坐标系，
    # 只要 TF 能转换到 global_frame。
    dynamic_obstacle_cloud_topic: /dynamic_obstacles
    dynamic_obstacle_range: 8.0
    collision_check_radius: 0.6
    max_dynamic_obstacles: 5000
    cmd_vel_topic: /cmd_vel
    global_frame: map
    robot_frame: base_link
    tf_lookup_timeout: 0.02
    auto_start_on_path: true
    use_obstacle_cloud: true
    enable_manual_debug_inputs: false
